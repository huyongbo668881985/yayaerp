services:
  jxc:
    build: .
    container_name: jxc-app
    restart: unless-stopped
    # .env 里的所有变量（SESSION_SECRET、COOKIE_SECURE、TRUST_PROXY、
    # 阿里云短信 AK/签名/模板、SMTP、飞书 webhook 等）整体注入容器。
    # .env 不存在时 compose 会直接报错拒绝启动——这是故意的，避免静默用弱密钥跑起来。
    env_file:
      - .env
    environment:
      - PORT=3000
    volumes:
      - ./data:/app/data
    healthcheck:
      # node:20-slim 里没有 curl/wget，直接用 node 自带的 fetch 探活
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # 只绑定本机回环地址（Docker 默认绑定 0.0.0.0，会把 3000 暴露到公网绕过 NPM 反代），
      # 公网流量必须经由 Nginx Proxy Manager 转发进来。
      - "127.0.0.1:3000:3000"
